<!DOCTYPE html>
<html lang="en">
<head>
    <link href="style.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <div  class="body">
        <div class="display">
           0
        </div>
        <div class="buttonsContainer">
          <div class="row">
               <button class = "clear">CLE</button>
               <button class="operator">/</button>
               <button class="operator">*</button>
               <button class="operator">-</button>
          </div>
          <div class="row">
              <button>7</button>
              <button>8</button>
              <button>9</button>
              <button class="operator">+</button>
          </div>
          <div class="row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="equals">=</button>
          </div>
          <div class="row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>0</button>
          </div> 
          <div class="row">
            <button class="decimal">.</button>
            <button class="backspace">⌫</button>
          </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
